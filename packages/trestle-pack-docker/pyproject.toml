[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trestle-pack-docker"
# lockstep with Trestle (P-18)
version = "0.7.0"
description = "The docker bundled pack's library: the mechanism behind its Trestle plugin"
readme = "README.md"
requires-python = ">=3.12"
# The standard library and `trestle.plugin`, nothing else: `trestle pack install` installs a
# bundled library with --no-deps into the service's Python, where Trestle already is. The plugin
# runs the `docker compose` CLI, so the library needs no tool package.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["trestle_pack_docker"]
