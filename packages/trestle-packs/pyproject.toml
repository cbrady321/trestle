[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trestle-packs"
version = "0.5.2"
description = "The workflow foundation behind Trestle's composite plugins: ports, fakes, helpers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["trestle"]

[project.optional-dependencies]
# The library needs none of these. The extras stay for the tests (here and in the bundled packs
# under packages/trestle-pack-*), which run pytest, Alembic and Yoyo on the test interpreter.
docker = []
pytest = ["pytest>=8.0"]
migrate = ["alembic>=1.13", "yoyo-migrations>=9.0"]
all = [
    "pytest>=8.0",
    "alembic>=1.13",
    "yoyo-migrations>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["trestle_packs"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
