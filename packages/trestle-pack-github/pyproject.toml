[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trestle-pack-github"
version = "0.5.2"
description = "The library behind Trestle's bundled github pack: PR status, checks, comments and opening PRs through gh"
readme = "README.md"
requires-python = ">=3.12"
# Installed with --no-deps from the pack copy: the standard library and Trestle's plugin surface only.
dependencies = ["trestle"]

[tool.hatch.build.targets.wheel]
packages = ["trestle_pack_github"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
