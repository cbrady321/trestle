[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trestle-pack-github"
version = "0.7.1"
description = "The library behind Trestle's bundled github pack: PR status, checks, comments and opening PRs through gh"
readme = "README.md"
requires-python = ">=3.12"
# The standard library and `trestle.plugin`, nothing else: `trestle pack install` installs a
# bundled library with --no-deps into the service's Python, where Trestle already is.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["trestle_pack_github"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
