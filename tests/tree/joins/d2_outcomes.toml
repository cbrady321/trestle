# tests/tree/joins/d2_outcomes.toml -- MC-B3-05 (L.TR-L.11, L.TR-5.4): the D2 outcome record of the tree-lift
# fossils `tests/fixtures/fossils/tree-trl` and `tree-tr5`. One `[[run]]` per `python -m tests.proof.differ d2 --reader <ref> --fossils
# <root>` run (J-TRL T5, which never blocks): merge "TR-L" | "TR-5", the reader ref as passed to d2, its resolved
# sha, the fossil directory, d2's exit code and the unexcused diverging state paths d2 named (`UNEXPECTED: state
# '<band>/<state>'` lines). The permanent T6 (`test_j_trl.py::test_trl_rollback_class_consistent`) reads this file
# and tests/proof/rollback.toml only; it never re-runs d2 and never reads the live d2_exceptions.toml (DM-79).
#
# Two facts about how these runs were made (recorded in A2-TRL11-RETURN.md):
#  * `differ d2 --fossils DIR` treats DIR as the root of BANDS (`DIR/<band>/MANIFEST.toml`), so the plan's literal
#    `--fossils tests/fixtures/fossils/tree-trl` finds no state and exits 0 vacuously. Each run below points d2 at
#    a scratch root holding one symlink `tree-trl -> tests/fixtures/fossils/tree-trl` (the TR-5 runs, likewise,
#    `tree-tr5 -> tests/fixtures/fossils/tree-tr5`).
#  * The lanes ran before the tag `wr-ckpt/single` existed and recorded `origin/master` (then 45efafc, the J-SINGLE
#    carrier) and the lanes' merge base 9b7cd8a (J-CORE). At the bundle's merge-forward (A-2 finalize, origin/master
#    3e26e39) every run was re-made over the same states: reader `wr-ckpt/single` (675f226, `WR-Merge: J-SINGLE`),
#    reader `origin/master` (3e26e39) and reader 9b7cd8a. Every exit is 0 with no diverging path, so TR-L and TR-5
#    stay transparent. E-TR-1 in d2_exceptions.toml is keyed to `wr-ckpt/single`, as the plan says.

[[run]]
merge = "TR-L"
reader = "wr-ckpt/single"
reader_sha = "675f2262bd2aa25fa5d52b55de87d21b9debdf71"
fossils = "tests/fixtures/fossils/tree-trl"
exit = 0
diverged = []

[[run]]
merge = "TR-L"
reader = "origin/master"
reader_sha = "3e26e39f6e8ae68fa894c135f297ee538be21b1"
fossils = "tests/fixtures/fossils/tree-trl"
exit = 0
diverged = []

[[run]]
