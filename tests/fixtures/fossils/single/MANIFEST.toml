absent = false
s0_projection = { state = "cancelled", kinds = ["created", "admitted", "started", "process_identity", "stop_row", "group_stop", "lane_folded", "error_record", "execution_ended", "evidence_finalized", "cancelled"], meta_keys = [] }

[[state]]
id = "terminal-timed-out"
producer = "tests.proof.fossil_states.single:produce_terminal_timed_out"
absent = false
s0_projection = { state = "timed_out", kinds = ["created", "admitted", "started", "process_identity", "stop_row", "group_stop", "lane_folded", "error_record", "execution_ended", "evidence_finalized", "timed_out"], meta_keys = [] }

[[state]]
id = "planless-started"
producer = "tests.proof.fossil_states.single:produce_planless_started"
absent = false
s0_projection = { state = "interrupted", kinds = ["created", "admitted", "started", "group_stop", "error_record", "evidence_finalized", "interrupted"], meta_keys = [] }
