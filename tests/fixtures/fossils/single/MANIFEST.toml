# Single-level fossil-state manifest (L.SL-11.2; MC-11, CM-5). Schema as s0/MANIFEST.toml: [[state]]
# {id, producer = "module:function", absent = bool, s0_projection = {state, kinds, meta_keys}}.
# `s0_projection.state` is the state the writer's own reader projects after recovery (`differ d2`
# compares an older reader's projection with it; a divergence is excused only by a named CM-9
# exception in d2_exceptions.toml). State ids are unique across every band's MANIFEST.
#
# `kinds` are the distinct ledger row kinds, in first-occurrence order, as the writer's own reader
# reads the recovered run (`d2_driver`); a repeated kind (process_identity, lane_folded) is listed
# once because how many rows a live run wrote is timing, not shape. `meta_keys` is not asserted
# here.
#
# The state directories are NOT committed by L.SL-11.2: L.J-SINGLE.1 generates them
# (`python -m tests.proof.fossils generate --checkpoint single --states all`) inside the
# checkpoint merge (CM-5).

[[state]]
id = "inflight-plan-bearing"
producer = "tests.proof.fossil_states.single:produce_inflight_plan_bearing"
absent = false
s0_projection = { state = "interrupted", kinds = ["created", "admitted", "started", "process_identity", "group_stop", "lane_folded", "error_record", "evidence_finalized", "interrupted"], meta_keys = [] }

[[state]]
id = "terminal-passed"
producer = "tests.proof.fossil_states.single:produce_terminal_passed"
absent = false
s0_projection = { state = "succeeded", kinds = ["created", "admitted", "started", "process_identity", "group_stop", "lane_folded", "execution_ended", "evidence_finalized", "succeeded"], meta_keys = [] }

[[state]]
