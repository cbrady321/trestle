# Slice A fossil-state manifest (L.J-SLICE-A.1; MC-11, CM-5 role 1; J-SLICE-A S10, S8).
# Every band's producers so far, run by the tree-band head (the J-SLICE-A candidate), one state each:
# s0/ (P0; core/'s producers are s0's, so core is not repeated), single/ (L.SL-11.2), tree-trl/
# (L.TR-L.11) and tree-tr5/ (L.TR-5.4). Same schema, producers, `absent` flags and `s0_projection`
# as the source band, copied verbatim; only the id changes: `<source id>-slice-a`, because a state id
# may be declared in one MANIFEST only (tests/proof/fossils.py load_states raises otherwise, and
# differ d2 keys its report by state id). The plan's "keep their ids" (a2-tree.md L.J-SLICE-A.1) is
# met as far as the loader allows: the source id is kept as the prefix, so `trl-*`/`tr5-*` states
# still match E-TR-1's `*/trl-views-*`, `*/tr5-views-*` globs (left exactly as written, CM-9) and
# slice_a.py S10's `^(trl|tr5)-(inflight|terminal)-` pattern. Generated with
#   python -m tests.proof.fossils generate --checkpoint slice-a --states all --fossils-root <scratch>
# over a scratch root holding only this band (so `--states all` cannot rewrite another band), then
# copied here (the J-CORE / J-SINGLE precedent).

