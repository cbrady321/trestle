# Root fossil-state manifest (L.J-ROOT.1; MC-11, CM-5 role 1; J-ROOT lane glob tests/fixtures/fossils/root/**).
# Every band's producers so far, run by the J-ROOT candidate head, one state each: the slice-a band's states
# (s0/, single/, tree-trl/, tree-tr5/; core/'s producers are s0's, so core is not repeated) and slice-b/'s three
# reference-workflow states. Same schema, producers, `absent` flags and `s0_projection` as the source band, copied
# verbatim; only the id changes: `<source id>-root` (load_states refuses an id declared in two MANIFESTs; the source
# id is kept as the prefix, so E-TR-1's `*/trl-views-*`, `*/tr5-views-*` globs still match). Generated with
#   python -m tests.proof.fossils generate --checkpoint root --states all --fossils-root <scratch>
# over a scratch root holding only this band (so `--states all` cannot rewrite another band), then copied here
# (the J-CORE / J-SINGLE / J-SLICE-A / J-SLICE-B precedent).

