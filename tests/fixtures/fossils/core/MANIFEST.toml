# Core fossil-state manifest (L.J-CORE.1, CM-5 role 1; J-CORE condition (j)).
# The S0 MANIFEST's producers (tests/fixtures/fossils/s0/MANIFEST.toml, P0, read only)
# run by core code at the J-CORE candidate head, one state each. Same schema, producers,
# `absent` flags and `s0_projection` (what the S0 reader must still project, d2) as s0;
# ids carry a `core-` prefix because a state id may be declared in one MANIFEST only
# (tests/proof/fossils.py load_states). Generated with
#   python -m tests.proof.fossils generate --checkpoint core --states all --fossils-root <scratch>
# over a scratch root holding only this band (so `--states all` cannot rewrite the s0
# corpus), then copied here.

[[state]]
id = "core-succeeded"
producer = "tests.proof.fossils:produce_succeeded"
absent = false
s0_projection = { state = "succeeded", kinds = ["created", "admitted", "started", "execution_ended", "evidence_finalized", "succeeded"], meta_keys = ["artifact_count", "classification", "duration_ms", "limits_exceeded", "result_state", "run_id"] }

