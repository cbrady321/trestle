# Permitted additive refusal/projection codes (L.P0-0d.13). facet = "refusal_codes",
# direction = "additive", `codes` = wire-value fnmatch patterns. The S0 codes
# golden stays strict: a code is admitted only when named here; an S0 code
# removed or renamed is `missing` and always fails. Add ONE entry per code a
# core leaf introduces, citing its row/leaf. Seeded only with what MC-06
# (plan-workflow-runtime.md:979) names verbatim.

[[entry]]
id = "ADD-code-projection-outside-window"
facet = "refusal_codes"
row_or_k = "MC-06"
