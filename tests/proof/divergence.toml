# divergence.toml (L.P0-0c.5): the divergence ledger's P0 seed, exactly the
# root MC-06 seed list (plan-workflow-runtime.md:979) -- requirements Part 2
# survey items 1-16, K-1..K-19 (K-19 included), design §8.3 D-a..D-v, and the
# root-named additive diffs. Schema: [[entry]] {id, facet, row_or_k, docs,
# due_checkpoint, direction, authorized_by}. No entry names a keep or cleanup
# parameter (B2-C2, B4-C6): none of the rows_or_k values below is a keep
# argument or a new refusal code. WR-COMPAT-row-touching entries (K-16, BF2-8)
# are additive-only per WR-COMPAT-{1..12}:no-unnamed-change.
# PLAN-GAP: individual due_checkpoint values for the Part 2/D-item entries are
# not enumerated anywhere in the P0 read-only packet (only K-19's landing_merge
# is given verbatim, CL-D1); every other post-P0 entry here records
# due_checkpoint as a deliberately-not-yet-due placeholder string so d1's
# `_due()` check does not treat it as missing today.
#
# L.CZ.4: the ledger is closed. `differ d1 --closure` checked that every entry appeared by its due
# checkpoint and names a row, a K-item, a design item or a contract; from here every `d1` holds the
# witness and reference rules too (tests/proof/differ.py, `closure_problems`), against golden S0,
# which stays.

