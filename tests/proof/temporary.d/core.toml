# tests/proof/temporary.d/core.toml — phase CORE (plans/core.md). Schema CM-7 (MC-07); permanent = false on every entry.
[[entry]]
id                = "TM-C1"
mechanism         = "one grace+kill stopper applied at both stop call sites; RunRegistry.request_cancel still signals"
introduced_by     = "L.CS-2.2"
serves            = []   # no core clause depends on its absence (I-P2-9); SV-3 registers the labels its removal enables
probe             = "python -c \"import inspect,sys,trestle.server.runs as r;sys.exit(0 if 'stop_group(' in inspect.getsource(r.RunRegistry.request_cancel) else 1)\""
removal_condition = "U2 sole signaller; request path writes only the cancel flag; stop row (MC-21) present"
removed_by        = "L.SV-3.6"
permanent         = false

