# tests/proof/temporary.d/single.toml -- phase SINGLE (plans/a1-single-level.md). Schema CM-7 (MC-07);
# permanent = false on every entry. L.SV-0.2 writes only this comment header: each [[entry]] is appended
# by its introducing leaf (L.SV-3.4 admission-audit-hook, L.SV-3.5 multi-vertex-refusal, L.SV-3.7
# release-executable-allowlist-empty, L.SV-5.7 loop-walk-children-absent, L.SV-5.9 one-vertex-spine-fixture).
# Deferrals (CM-8), lane worktrees, the lane-only workflow file and the D2 exception E-SV3-1 (CM-9) are not
# register entries (CM-7).

[[entry]]
id                = "admission-audit-hook"        # plan id TM-B2-8
mechanism         = "trestle/server/admission.py::write_admitted_run appends one ndjson line {run_dir, vertex_count, plugin, pid, nodeid} per admission to the file TRESTLE_ADMISSION_AUDIT names (unset -> no write): test instrumentation read only by J-SINGLE (b) and the A-1 MJ vertex audits before J-SINGLE"
introduced_by     = "L.SV-3.4"
serves            = []
probe             = "grep -q TRESTLE_ADMISSION_AUDIT trestle/server/admission.py"   # exit 0 = present
removal_condition = "J-SINGLE evaluated (its conditions never re-run, DM-11)"
removed_by        = "L.TR-1.1"
permanent         = false

[[entry]]
id                = "release-executable-allowlist-empty"   # plan id TM-B2-2
mechanism         = "TrestleConfig.operator_limits.release_executables defaults to frozenset() (F-11(b) neutral)"
introduced_by     = "L.SV-3.7"
serves            = []
probe             = "python -c \"import sys;from trestle.server.config import TrestleConfig as C;sys.exit(0 if not C.defaults().operator_limits.release_executables else 1)\""
removal_condition = "none while F-11(b) (allowlist owner/default) is open; RB-0 populates only the reference operator config"
removed_by        = "named-not-removed"
permanent         = false
citation          = "root C.9 F-11(a/b); design §10 F-11(b)"
