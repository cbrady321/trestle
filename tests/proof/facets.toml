# Facet inventory (L.P0-0a.4). Schema (p0-court.md "## Leaves and joins"
# verifier text): [[facet]] {id, lane, golden, extractor = "module:function"
# | "pending", additive = "named" | "free"}
#
# `golden` names the tests/fixtures/golden/s0/<facet>.json this facet
# renders against; every entry is `extractor = "pending"` until its lane
# builds the real extractor (P0-1A..E; L.P0-1A.7 builds ledger_kinds,
# meta_fields, fossil_projection).

