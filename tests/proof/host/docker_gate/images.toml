# Digest-pinned image set for the host-docker preflight (DM-24; L.P0-0d.6; roles by L.NW-2.10, MC-B-10).
# An unpinned entry (empty digest) always records PRECONDITION_UNMET. The three roles were pinned
# on 2026-09-30 from the cached images (PX-3's image half, user-granted). `python -m tests.proof.host.docker_gate pin-images` records each cached
# ref's registry digest (the `RepoDigests` entry, never the image Id) and commits nothing itself.

[alpine]
ref = "alpine:3.20"
digest = "sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"

