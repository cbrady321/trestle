# Digest-pinned image set for the host-docker preflight (DM-24; L.P0-0d.6; roles by L.NW-2.10, MC-B-10).
# An unpinned entry (empty digest) always records PRECONDITION_UNMET — no pinned image is cached
# today (PX-3's image half). `python -m tests.proof.host.docker_gate pin-images` records each cached
# ref's registry digest (the `RepoDigests` entry, never the image Id) and commits nothing itself.

[alpine]
ref = "alpine:3.20"
digest = ""

[postgres]
ref = "postgres:16-alpine"
digest = ""

[http_support]
ref = "nginx:1.27-alpine"
digest = ""
