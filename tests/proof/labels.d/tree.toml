# tests/proof/labels.d/tree.toml -- phase TREE (plans/a2-tree.md, MC-B3-06, "Coverage (a)"). Schema CSC-1 (MC-04);
# read by meta audit-rows, meta open-questions and meta register. No other key or table shape is used.
# 110 labels; every one is a CSC-1 entry whose `declared_by` is the first leaf Coverage (a) lists for it;
# `composes` is the MC-03 tree clause the label's group names (a present register entry that serves that clause also
# serves the label, CM-7); `tier` is the requirements row's own tier (a Slice A label of a slice-split row carries its
# Slice A component; a join C-id label the tier of its first leaf's verifier); `venue` is the row's venue, BOTH for
# the venue-BOTH rows (WR-UNIT-3, WR-UNIT-6, WR-CANCEL-1, WR-CANCEL-2) and HOST only for the `@host` twin (CSC-9).
# `WR-TERM-5:tree-size` is the deferred core label (CM-8, closes_at TR-6): declared here with its closing leaf
# L.TR-6.4 as `declared_by`; until claimed it renders as any unclaimed label does (MC-02).

