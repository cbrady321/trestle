                 "tests/proof/differ_modes/d8_*.py", "tests/proof/fossil_states/single.py", "tests/fixtures/fossils/single/MANIFEST.toml",
                 "tests/proof/drift/single/test_sa09_*.py"]

[[lane]]
name          = "sl-h"
branch_prefix = "wr/sl-h/"
globs         = ["trestle/server/lease.py", "trestle/server/answer.py", "tests/single/control/**", "tests/single/answer/**",
                 "trestle/server/control.py", "trestle/server/main.py", "trestle/server/admission.py", "trestle/server/scheduler.py",
                 "trestle/server/conductor.py", "trestle/server/project.py", "trestle/common/codes.py"]


# The single product bundle (one PR, CM-2 bundle): its globs are the union of the seven product lanes' globs
# above (89 distinct) plus what the leaves need and no lane owns: tests/proof/differ.py (d4/d5/d8 builders delete
# their UNBUILT_MODES keys), tests/proof/divergence.toml (named ADD-code-* entries for the new wire codes),
# tests/proof/drift/core/test_sa05_clock.py (the published release slice changes core's SA-05 assertions), and the
# package markers of the new test trees, and core's deferral test (it asserted that no deferral label is declared
# `claim`; the single fragment declares the two deferred core labels it claims at SL-8). At assembly the bundle lane
# gained every other path a leaf touched outside the lane blocks: TM-P0-3's probe in temporary.d/p0.toml (SV-1.4),
# the answer fetch handle in projection.py, core's execution-code and spec-key pins and the published
# sweep_parallelism in test_tolerances_cli.py (SV-3.4/SV-4.2), the context-surface compat pin (SV-5.1), the packs
# import boundary (SL-3.3), and ci.yml (the ckpt job skips helper modules under tests/proof/ckpt, SV-5.14).
[[lane]]
name          = "single-bundle"
branch_prefix = "wr/single-bundle/"
globs         = ["docs/agent-console-mcp.md", "docs/agents.md", ".cursor/skills/trestle/SKILL.md",
                 "tests/single/docs/**", "tests/proof/fence.d/single.toml", "tests/proof/labels.d/single.toml",
                 "tests/proof/temporary.d/single.toml", "trestle/common/lane_format.py", "trestle/common/plan/bounds.py",
                 "trestle/child/attempt_lane.py", "trestle/server/fold.py", "trestle/server/conductor.py",
                 "trestle/server/recovery.py", "trestle/common/clock.py", "tests/proof/records.py",
                 "tests/proof/record_facts.py", "tests/single/record/**", "tests/proof/drift/single/test_sa01_*.py",
                 "trestle/workflow/__init__.py", "trestle/workflow/declarations.py", "trestle/workflow/extract.py",
                 "trestle/common/plan/__init__.py", "trestle/common/plan/declared.py", "trestle/child/validate.py",
                 "trestle/server/plugin_validate.py", "trestle/server/snapshots.py", "trestle/common/codes.py",
                 "tests/single/contract/**", "tests/fixtures/workflows/contract_*.py",
                 "tests/proof/drift/single/test_sa02_declared_tree.py", "trestle/common/plan/compiler.py",
                 "trestle/common/plan/carving.py", "trestle/common/plan/ordinal.py", "trestle/common/plan/formats.py",
                 "trestle/common/plan/precedence.py", "trestle/common/plan/vocabulary.py", "tests/proof/foundations/**",
                 "trestle/server/sweep.py", "trestle/server/config.py", "trestle/server/answer.py",
                 "trestle/server/admission.py", "trestle/server/runs.py", "trestle/server/project.py",
                 "trestle/server/scheduler.py", "trestle/common/types.py", "docs/plugins.md", "tests/single/control/**",
                 "tests/single/answer/**", "tests/fixtures/workflows/probe_*.py", "tests/proof/rollback.toml",
                 "tests/proof/probes/single.py", "tests/proof/drain_check.py", "tests/proof/meta.py",
                 "tests/proof/d2_exceptions.toml", "tests/proof/differ_modes/d4_*.py",
                 "tests/proof/differ_modes/d5_*.py", "tests/proof/drift/single/test_sa03_*.py",
                 "tests/proof/drift/single/test_sa05_*.py", "trestle/workflow/**", "trestle/plugin/surface.py",
                 "trestle/child/run_services.py", "trestle/child/context.py", "trestle/child/main.py",
                 "packages/trestle-packs/trestle_packs/fakes/__init__.py",
                 "packages/trestle-packs/trestle_packs/fakes/command.py",
                 "packages/trestle-packs/trestle_packs/fakes/marker.py", "tests/fixtures/workflows/**",
                 "tests/single/workflow/**", "tests/single/spine/**", "tests/proof/harness.py", "tests/proof/spine/**",
                 "tests/proof/suites/**", "tests/proof/ckpt/single*.py", "tests/proof/drift/single/test_sa04_*.py",
                 "tests/proof/drift/single/test_sa06_*.py", "tests/proof/drift/single/test_sa09_*.py",
                 "tests/proof/drift/single/test_sa14_*.py", ".github/workflows/lane-sv-runtime.yml",
                 "trestle/server/registry.py", "packages/trestle-packs/pyproject.toml",
                 "packages/trestle-packs/trestle_packs/process/**",
                 "packages/trestle-packs/trestle_packs/fakes/local_process.py", "tests/proof/spine/test_termination.py",
