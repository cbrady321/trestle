                 "tests/fixtures/fossils/single/MANIFEST.toml", "trestle/server/lease.py", "trestle/server/control.py",
                 "trestle/server/main.py", "tests/proof/differ.py", "tests/proof/divergence.toml",
                 "tests/proof/drift/core/test_sa05_clock.py", "tests/single/__init__.py",
                 "tests/proof/drift/single/__init__.py", "tests/proof/probes/__init__.py",
                 "tests/proof/differ_modes/__init__.py", "tests/proof/fossil_states/__init__.py",
                 "tests/core/docs/test_cl_d1_deferrals.py",
