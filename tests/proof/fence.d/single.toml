# tests/proof/fence.d/single.toml -- phase SINGLE (plans/a1-single-level.md). Schema CM-2 (MC-08), closed: no other key.
# BUNDLE FORM (deviation from the plan's 8-lane / 18-gate payload, recorded in A1-DOCS-RETURN.md): the 17 product
# gates below share ONE branch `wr/single-bundle/single`, so R4 judges every chunk against the `single-bundle` lane,
# and `match_gates` lands them in requires_merge order (greedy over config order; the table order below is the
# landing order). J-SINGLE stays alone on its checkpoint branch. The seven per-lane blocks stay verbatim for the
# lane branches' own local checks; every glob they gain must also be added to the bundle lane.
phase        = "single"

[[lane]]
name          = "sv-docs"
branch_prefix = "wr/sv-docs/"
globs         = ["docs/agent-console-mcp.md", "docs/agents.md", ".cursor/skills/trestle/SKILL.md", "tests/single/docs/**",
                 "tests/proof/fence.d/single.toml", "tests/proof/labels.d/single.toml", "tests/proof/temporary.d/single.toml"]

[[lane]]
name          = "sv-rec"
branch_prefix = "wr/sv-rec/"
globs         = ["trestle/common/lane_format.py", "trestle/common/plan/bounds.py", "trestle/child/attempt_lane.py", "trestle/server/fold.py",
                 "trestle/server/conductor.py", "trestle/server/recovery.py",
                 "trestle/common/clock.py", "tests/proof/records.py", "tests/proof/record_facts.py",
                 "tests/single/record/**", "tests/proof/drift/single/test_sa01_*.py"]

[[lane]]
name          = "sv-con"
branch_prefix = "wr/sv-con/"
globs         = ["trestle/workflow/__init__.py", "trestle/workflow/declarations.py", "trestle/workflow/extract.py",
                 "trestle/common/plan/__init__.py", "trestle/common/plan/declared.py", "trestle/child/validate.py",
                 "trestle/server/plugin_validate.py", "trestle/server/snapshots.py", "trestle/common/codes.py",
                 "tests/single/contract/**", "tests/fixtures/workflows/contract_*.py", "tests/proof/drift/single/test_sa02_declared_tree.py"]

[[lane]]                     # also carries the FOUNDATIONS commits (cherry-picked)
name          = "sv-host"
branch_prefix = "wr/sv-host/"
globs         = ["trestle/common/plan/compiler.py", "trestle/common/plan/carving.py", "trestle/common/plan/ordinal.py",
                 "trestle/common/plan/formats.py", "trestle/common/plan/precedence.py", "trestle/common/plan/vocabulary.py",
                 "tests/proof/foundations/**", "trestle/server/sweep.py", "trestle/server/config.py",
                 "trestle/server/answer.py", "trestle/common/clock.py",
                 "trestle/server/admission.py", "trestle/server/conductor.py", "trestle/server/runs.py", "trestle/server/recovery.py",
                 "trestle/server/project.py", "trestle/server/scheduler.py", "trestle/common/types.py", "trestle/common/codes.py",
                 "docs/plugins.md", "tests/proof/temporary.d/single.toml",
                 "tests/single/control/**", "tests/single/answer/**", "tests/fixtures/workflows/probe_*.py",
                 "tests/proof/rollback.toml", "tests/proof/probes/single.py",
                 "tests/proof/drain_check.py", "tests/proof/meta.py", "tests/proof/d2_exceptions.toml",
                 "tests/proof/differ_modes/d4_*.py", "tests/proof/differ_modes/d5_*.py",
                 "tests/proof/drift/single/test_sa03_*.py", "tests/proof/drift/single/test_sa05_*.py"]

[[lane]]
name          = "sv-runtime"
branch_prefix = "wr/sv-runtime/"
globs         = ["trestle/workflow/**", "trestle/plugin/surface.py", "trestle/child/run_services.py",
                 "trestle/child/context.py", "trestle/child/main.py", "docs/plugins.md", "tests/proof/temporary.d/single.toml",
                 "packages/trestle-packs/trestle_packs/fakes/__init__.py", "packages/trestle-packs/trestle_packs/fakes/command.py",
                 "packages/trestle-packs/trestle_packs/fakes/marker.py",
                 "tests/fixtures/workflows/**", "tests/single/workflow/**", "tests/single/spine/**", "tests/proof/harness.py",
                 "tests/proof/spine/**", "tests/proof/suites/**", "tests/proof/ckpt/single*.py", "tests/proof/probes/single.py",
                 "tests/proof/drift/single/test_sa01_*.py", "tests/proof/drift/single/test_sa04_*.py",
                 "tests/proof/drift/single/test_sa06_*.py", "tests/proof/drift/single/test_sa09_*.py",
                 "tests/proof/drift/single/test_sa14_*.py", ".github/workflows/lane-sv-runtime.yml"]

[[lane]]                     # packs paths narrowed to what A-1 edits (DM-69)
