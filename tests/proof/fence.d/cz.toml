# tests/proof/fence.d/cz.toml — L.CZ.1
phase = "cz"

[[lane]]
name          = "cz"
branch_prefix = "wr/cz/"
globs         = ["tests/proof/meta.py", "tests/proof/ckpt/root.py", "tests/proof/differ.py", "tests/proof/divergence.toml",
                 "tests/proof/row_owners.toml", "tests/proof/k_doc_map.toml", "tests/proof/open_questions.toml",
                 "tests/proof/temporary.toml", "tests/proof/rollback.toml", "tests/proof/labels.d/cz.toml", "tests/proof/fence.d/cz.toml",
                 "tests/proof/selftest/test_enforce.py", "tests/proof/selftest/test_audit_rows.py", "tests/proof/selftest/test_kdoc.py",
                 "tests/proof/selftest/test_divergence_closure.py", "tests/proof/selftest/test_spine_budget.py",
                 "tests/proof/selftest/spine_budget_check.py",
                 "tests/proof/selftest/test_mc_locality.py", "tests/proof/selftest/test_open_questions.py",
                 "tests/proof/selftest/test_register_final.py", "tests/proof/selftest/test_ckpt.py",
                 # L.CZ.1 also edits these two (the deferral posture gains step "CZ"; the report-mode
                 # enforce test becomes the --scope ci one); the plan literal omits them (plan gap).
                 "tests/core/docs/test_cl_d1_deferrals.py", "tests/proof/selftest/test_ledger.py",
                 # root.py's J-ROOT-7:review reads RV-1..RV-5 root records; reviews.CRITERIA had no RV-2,
                 # so the validator gains it here (L.CZ.9.fix1), before the J-ROOT lane (fossils and
                 # reviews only, CM-5) records it.
                 "tests/proof/reviews.py", "tests/proof/selftest/test_reviews.py",
                 "docs/*.md", "!docs/environment.md", ".github/workflows/ci.yml", ".cursor/skills/trestle/SKILL.md"]

[[lane]]                     # the root checkpoint merge; diff limited to CM-5's checkpoint paths
name          = "j-root"
branch_prefix = "wr/j-root/"
globs         = ["tests/fixtures/fossils/root/**", "tests/proof/reviews/*-root.toml"]

[[gate]]
branch         = "wr/cz/cz"
merge          = "CZ"
requires_merge = ["J-SLICE-B"]

[[gate]]
branch         = "wr/j-root/j-root"
merge          = "J-ROOT"
requires_merge = ["CZ"]
