# tests/proof/fence.d/slice-b.toml -- phase SLICE-B (plans/b-slice-b.md). Schema CM-2 (MC-08), closed: no other key.
# BUNDLE FORM (deviation from the plan's per-merge branches, recorded in B-LEGACY-RETURN.md): the 16 product gates
# below share ONE branch `wr/slice-b-bundle/slice-b`, so R4 judges every chunk against the `slice-b-bundle` lane, and
# `match_gates` lands them in requires_merge order (greedy over config order; the table order below is the landing
# order). RB-13 (conditional catch-up) and J-SLICE-B keep their own branches. The b-legacy, b-adapters, b-env and
# b-ckpt blocks stay verbatim from the plan literal for the lane branches' own local checks; every glob they gain must
# also be added to the bundle lane.
