name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check trestle tests packages/trestle-packs conftest.py scripts/smoke_packs.py scripts/demo_pack_workflows.py
      - run: ruff format --check trestle tests packages/trestle-packs conftest.py scripts/smoke_packs.py scripts/demo_pack_workflows.py
      - run: python -m tests.proof.meta mypy-ratchet --max 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packs]"
      - run: python -m tests.proof.guards clean-path --github-env
      - run: pytest -q
        env:
          TRESTLE_PROOF_GATE: ci-test
      - run: pytest -q -c pyproject.toml --rootdir . packages/trestle-packs/tests
        env:
          TRESTLE_PROOF_GATE: ci-test
      - run: python scripts/smoke_agent_mcp.py
      - run: python scripts/smoke_operator_api.py
      - run: python scripts/smoke_packs.py
      - run: python scripts/demo_pack_workflows.py
      - uses: actions/upload-artifact@v4
        with:
          name: proof-results-ci-test
          path: tests/proof/results/
          if-no-files-found: ignore

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packs]"
      - run: python -m tests.proof.guards clean-path --github-env
      - run: pytest -q -m compat
        env:
          TRESTLE_PROOF_GATE: ci-compat
      - uses: actions/upload-artifact@v4
        with:
          name: proof-results-ci-compat
          path: tests/proof/results/
          if-no-files-found: ignore

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packs]"
      - run: python -m tests.proof.guards clean-path --github-env
      - run: pytest -q tests/proof/selftest/test_guards.py tests/proof/selftest/test_session.py
        env:
          TRESTLE_PROOF_GATE: ci-guards
      - uses: actions/upload-artifact@v4
        with:
          name: proof-results-ci-guards
          path: tests/proof/results/
          if-no-files-found: ignore

  ancestry:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m tests.proof.guards clean-path --github-env
      - run: pytest -q tests/proof/drift/test_sa10_attribution.py tests/proof/selftest/test_ancestry.py
        env:
          TRESTLE_PROOF_GATE: ${{ matrix.os == 'ubuntu-latest' && 'ci-ancestry-linux' || 'ci-ancestry-macos' }}
      - uses: actions/upload-artifact@v4
        with:
          name: proof-results-ci-ancestry-${{ matrix.os }}
          path: tests/proof/results/
          if-no-files-found: ignore

  d2-straddle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m tests.proof.guards clean-path --github-env
      - run: python -m tests.proof.fossils generate --checkpoint s0 --states succeeded,failed
      - run: pytest -q tests/proof/drift/test_sa15_d2_surfaces.py tests/proof/selftest/test_d2.py
        env:
          TRESTLE_PROOF_GATE: ci-d2
      - run: python -m tests.proof.differ d2 --reader s0
      - uses: actions/upload-artifact@v4
        with:
          name: proof-results-ci-d2
          path: tests/proof/results/
          if-no-files-found: ignore

  proof-ledger:
    runs-on: ubuntu-latest
    needs: [test, compat, guards, ancestry, d2-straddle]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packs]"
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-results-*
          path: tests/proof/results
          merge-multiple: true
      - run: python -m tests.proof.meta report --json > proof-ledger.json
      - uses: actions/upload-artifact@v4
        with:
          name: proof-ledger.json
          path: proof-ledger.json

  # CM-7's decline drill (L.CS-1.4): every CK merge on HEAD declines cleanly. Runs on
  # pull_request and push to master, so it is a required job (CM-4); it sets no
  # TRESTLE_PROOF_GATE and produces no proof result (CSC-13). The drill's scratch worktrees
  # need full history (trailers, the landing diff, `git log <landing>..HEAD`).
  ck-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packs]"
      - run: python -m tests.proof.guards clean-path --github-env
      - run: pytest tests/core/tooling/test_ck_drill.py -q
        env:
          TRESTLE_CK_ISOLATION: "1"

  # CM-5 checkpoint evaluation (L.P0-0d.4). Push to master and
  # workflow_dispatch only, so it is outside CM-4's required-job list.
  # Idempotent: `meta ckpt` exits 0 without evaluating on a non-trigger
  # commit, or when TAG (or a successful `ckpt` run) already marks it.
  ckpt:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [lint, test, compat, guards, ancestry, d2-straddle, proof-ledger, ck-isolation]
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packs]"
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-results-*
          path: tests/proof/results
          merge-multiple: true
      - id: eval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p ckpt-out
          for f in tests/proof/ckpt/*.py; do
            mod=$(basename "$f" .py)
            [ "$mod" = "__init__" ] && continue
            name="${mod//_/-}"
            python -m tests.proof.meta ckpt "$name" | tee "ckpt-out/$name.txt"
            if grep -q "pass; digest=" "ckpt-out/$name.txt"; then
              tag=$(python -c "from tests.proof import ckpt; print(ckpt.load_module('$name').TAG or '')")
              if [ -n "$tag" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag -a "$tag" -m "CM-5 checkpoint $name" "$GITHUB_SHA"
                git push origin "refs/tags/$tag"
              else
                echo "artifact=ckpt-$name" >> "$GITHUB_OUTPUT"
              fi
            else
              rm "ckpt-out/$name.txt"
            fi
          done
      - if: steps.eval.outputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.eval.outputs.artifact }}
          path: ckpt-out/
